plugins {
	id 'com.gradleup.shadow'
}

loom {
	forge {
		mixinConfig 'projectgm_b.mixins.json'
		mixinConfig 'projectgm_b.client.mixins.json'
		mixinConfig 'projectgm_b.scholar.mixins.json'
	}
}

architectury {
	platformSetupLoomIde()
	forge()
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentForge.extendsFrom common
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
	modRuntimeOnly "maven.modrinth:simple-voice-chat:forge-${project.voicechat_mod_version}"
	forgeRuntimeLibrary "javazoom:jlayer:${project.jlayer_version}"
	include "javazoom:jlayer:${project.jlayer_version}"
	common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
	filteringCharset = 'UTF-8'
	inputs.property 'version', project.version
	filesMatching('META-INF/mods.toml') {
		expand version: inputs.properties.version
	}
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	inputFile.set shadowJar.archiveFile
}
